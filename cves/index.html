<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cves — bl4cksku11</title>
  <meta name="description" content="Published CVEs reported by Jose Rivas (bl4cksku11). Vulnerability research disclosures with links to the technical writeups and official advisories.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="bl4cksku11">
  <meta property="og:title" content="cves — bl4cksku11">
  <meta property="og:description" content="Published CVEs reported by Jose Rivas (bl4cksku11). Vulnerability research disclosures with links to writeups and official advisories.">
  <meta property="og:url" content="https://bl4cksku11.com/cves/">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="https://bl4cksku11.com/cves/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="/assets/theme-init.js"></script>

  <style>
    main.wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .page-header { margin-bottom: 2rem; }
    .page-header .crumb {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.6rem;
    }
    .page-header .crumb::before {
      content: '//';
      color: var(--red);
      margin-right: 0.4rem;
      font-weight: 700;
    }
    .page-header h1 {
      font-size: clamp(2rem, 6vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg-strong);
    }
    .page-header .subtitle {
      margin-top: 0.8rem;
      color: var(--mid);
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 640px;
    }

    .stats {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0 2.5rem;
      flex-wrap: wrap;
      font-family: 'Space Mono', monospace;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--fg-strong);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .stat-num::before {
      content: '›';
      color: var(--red);
      margin-right: 0.3rem;
      font-size: 1.4rem;
    }
    .stat-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 0.3rem;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .cve-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .cve-card {
      display: block;
      padding: 1.2rem 1.4rem;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      text-decoration: none;
      color: var(--fg);
      transition: border-color 0.15s, transform 0.15s;
    }
    .cve-card:hover {
      border-color: var(--border-strong);
      transform: translateX(2px);
    }
    .cve-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .cve-id {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--fg-strong);
      letter-spacing: 0.01em;
    }
    .cve-severity {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.25rem 0.55rem;
      border: 1px solid var(--red);
      color: var(--red);
    }
    .cve-severity.critical, .cve-severity.high {
      background: var(--red);
      color: var(--fg-strong);
      border-color: var(--red);
    }
    .cve-severity.medium {
      color: var(--red);
      background: transparent;
    }
    .cve-date {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
      margin-left: auto;
    }
    .cve-product {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
    }
    .cve-product::before {
      content: '//';
      color: var(--red);
      margin-right: 0.35rem;
    }
    .cve-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--fg-strong);
      line-height: 1.4;
      margin: 0.5rem 0 0.7rem;
    }
    .cve-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      font-size: 0.72rem;
      color: var(--mid);
    }
    .cve-meta .cwes {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .cve-meta .cwe {
      font-family: 'Space Mono', monospace;
      color: var(--dim);
      font-size: 0.68rem;
    }
    .cve-meta .fixed {
      font-family: 'Space Mono', monospace;
      color: var(--mid);
      font-size: 0.7rem;
    }
    .cve-meta .fixed::before { content: 'fix: '; color: var(--red); }
    .cve-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.6rem;
      font-size: 0.72rem;
    }
    .cve-links a {
      color: var(--mid);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .cve-links a:hover {
      color: var(--fg-strong);
      border-color: var(--red);
    }
    .cve-links a::before { content: '›'; color: var(--red); margin-right: 0.35rem; }

    footer.site-footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer.site-footer a { color: var(--dim); text-decoration: none; }
    footer.site-footer a:hover { color: var(--fg); }

    @media (max-width: 600px) {
      main.wrap { padding: 1.8rem 1rem 3rem; }
      .stats { gap: 1.4rem; margin: 1rem 0 2rem; }
      .stat-num { font-size: 1.5rem; }
      .cve-card { padding: 1rem 1.1rem; }
      .cve-head { gap: 0.6rem; }
      .cve-date { margin-left: 0; order: 3; width: 100%; margin-top: 0.2rem; }
      .cve-links { flex-wrap: wrap; gap: 0.8rem; }
      footer.site-footer { flex-direction: column; gap: 0.6rem; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="site-nav">
    <div class="site-nav-inner">
      <a href="/" class="site-brand">bl4cksku11</a>
      <nav class="site-menu" aria-label="Main">
        <a href="/">home</a>
        <a href="/blog/">blog</a>
        <a href="/cves/" aria-current="page">cves</a>
        <a href="/about/">about</a>
        <a href="/tools/">tools</a>
        <a href="/contact/">contact</a>
      </nav>
      <div class="site-controls">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        </div>
        <button class="theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
          <span class="theme-icon-dark">🌙</span>
          <span class="theme-icon-light">☀</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">

    <header class="page-header">
      <div class="crumb" id="crumb"></div>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <div class="stats" id="stats"></div>

    <div class="divider"></div>

    <section class="cve-list" id="cveList"></section>

  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> bl4cksku11</div>
    <div>
      <a href="/blog/">blog</a> · <a href="/cves/">cves</a> · <a href="/contact/">contact</a>
    </div>
  </footer>

  <script>
    const I18N = {
      es: {
        crumb: 'disclosures',
        title: 'cves',
        subtitle: 'CVEs asignados a partir de mi vulnerability research. Cada card enlaza al writeup técnico y al advisory oficial.',
        statCves: 'CVEs',
        statCritical: 'Críticos',
        statHigh: 'Altos',
        statMedium: 'Medios',
        linkBlog: 'writeup',
        linkAdvisory: 'advisory',
        linkCve: 'CVE record',
      },
      en: {
        crumb: 'disclosures',
        title: 'cves',
        subtitle: 'CVEs assigned from my vulnerability research. Each card links to the technical writeup and the official advisory.',
        statCves: 'CVEs',
        statCritical: 'Critical',
        statHigh: 'High',
        statMedium: 'Medium',
        linkBlog: 'writeup',
        linkAdvisory: 'advisory',
        linkCve: 'CVE record',
      }
    };

    let currentLang = (function () { try { return localStorage.getItem('lang') || 'en'; } catch (_) { return 'en'; } })();
    let allCves = [];

    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }
    function pickLang(field) {
      if (field == null) return '';
      if (typeof field === 'string') return field;
      return field[currentLang] || field.es || field.en || Object.values(field)[0] || '';
    }
    function formatDate(iso, lang) {
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-US', { year: 'numeric', month: 'short', day: '2-digit' });
    }

    function applyI18N() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('crumb').textContent    = t.crumb;
      document.getElementById('title').textContent    = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      renderStats();
      renderList();
    }

    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (_) {}
      applyI18N();
    }

    function renderStats() {
      const t = I18N[currentLang];
      const counts = { Critical: 0, High: 0, Medium: 0, Low: 0 };
      allCves.forEach(c => {
        const lvl = (c.severity && c.severity.level) || 'Medium';
        counts[lvl] = (counts[lvl] || 0) + 1;
      });
      const s = document.getElementById('stats');
      s.innerHTML = `
        <div class="stat">
          <div class="stat-num">${allCves.length}</div>
          <div class="stat-label">${t.statCves}</div>
        </div>
        <div class="stat">
          <div class="stat-num">${counts.Critical || 0}</div>
          <div class="stat-label">${t.statCritical}</div>
        </div>
        <div class="stat">
          <div class="stat-num">${counts.High || 0}</div>
          <div class="stat-label">${t.statHigh}</div>
        </div>
        <div class="stat">
          <div class="stat-num">${counts.Medium || 0}</div>
          <div class="stat-label">${t.statMedium}</div>
        </div>
      `;
    }

    function renderList() {
      const t = I18N[currentLang];
      const list = document.getElementById('cveList');
      const sorted = [...allCves].sort((a, b) => (a.date < b.date ? 1 : -1));
      list.innerHTML = sorted.map(c => {
        const sev = c.severity || {};
        const sevClass = String(sev.level || 'medium').toLowerCase();
        const sevText = `${sev.score ? sev.score + ' · ' : ''}${sev.level || ''}`.trim();
        const links = [];
        if (c.blog_slug) links.push(`<a href="/blog/p/${escapeHTML(c.blog_slug)}/">${t.linkBlog}</a>`);
        if (c.advisory)  links.push(`<a href="${escapeHTML(c.advisory)}" target="_blank" rel="noopener">${t.linkAdvisory}</a>`);
        links.push(`<a href="https://www.cve.org/CVERecord?id=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">${t.linkCve}</a>`);

        const cwes = (c.cwes || []).map(cwe => `<span class="cwe">${escapeHTML(cwe)}</span>`).join('');
        const fixed = c.fixed_in ? `<span class="fixed">${escapeHTML(c.fixed_in)}</span>` : '';

        return `
          <div class="cve-card">
            <div class="cve-head">
              <span class="cve-id">${escapeHTML(c.id)}</span>
              <span class="cve-severity ${sevClass}">${escapeHTML(sevText)}</span>
              <span class="cve-date">${escapeHTML(formatDate(c.date, currentLang))}</span>
            </div>
            <div class="cve-product">${escapeHTML(c.product)}</div>
            <div class="cve-title">${escapeHTML(pickLang(c.title))}</div>
            <div class="cve-meta">
              <div class="cwes">${cwes}</div>
              ${fixed}
            </div>
            <div class="cve-links">${links.join('')}</div>
          </div>
        `;
      }).join('');
    }

    async function loadCves() {
      try {
        const res = await fetch('/cves/cves.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('cves fetch failed');
        const data = await res.json();
        allCves = data.cves || [];
        applyI18N();
      } catch (err) {
        console.error(err);
        document.getElementById('cveList').innerHTML =
          `<div style="padding:3rem 1rem; text-align:center; color:var(--red); border:1px dashed var(--red);">failed to load cves.json</div>`;
      }
    }

    loadCves();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
