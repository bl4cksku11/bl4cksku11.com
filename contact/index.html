  <script>
    const I18N = {
      es: {
        crumb: 'contact',
        title: 'contacto',
        subtitle: 'Consultoría, red team engagements, coordinación de disclosure, o preguntas técnicas: el email es la vía más rápida.',
        chTitle: 'channels',
        intro: `<p>Para <strong>engagements de red team, pentest o consultoría</strong>, escribime al email. Respondo en menos de 48 horas hábiles. Para propuestas concretas, mandá scope y timeframe aproximados en el primer mail.</p><p>Para <strong>disclosure de vulnerabilidades relacionadas a mi research</strong> (blog o CVEs listados), usá los canales de HackerOne o Bugcrowd, o escribime directo si es coordinated disclosure sobre algo publicado.</p>`
      },
      en: {
        crumb: 'contact',
        title: 'contact',
        subtitle: 'Consulting, red team engagements, disclosure coordination, or technical questions: email is the fastest channel.',
        chTitle: 'channels',
        intro: `<p>For <strong>red team engagements, pentests, or consulting</strong>, drop me an email. I respond within 48 business hours. For concrete proposals, include scope and timeframe in the first mail.</p><p>For <strong>vulnerability disclosure related to my research</strong> (posts on the blog or CVEs listed), use the HackerOne or Bugcrowd channels, or email me directly if it's coordinated disclosure on something published.</p>`
      }
    };

    let currentLang = (function () { try { return localStorage.getItem('lang') || 'en'; } catch (_) { return 'en'; } })();

    function apply() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('crumb').textContent    = t.crumb;
      document.getElementById('title').textContent    = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('ch-title').textContent = t.chTitle;
      document.getElementById('intro').innerHTML      = t.intro;
    }
    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (_) {}
      apply();
    }
    apply();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
