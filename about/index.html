          <h2>Foco</h2>
          <p>Seguridad ofensiva full-scope. Trabajo tanto en <em>penetration tests</em> dirigidos a un scope técnico definido como en <em>red team engagements</em> adversariales con objetivo del negocio. Los reportes que entrego priorizan las rutas de ataque reales y accionables, con severidad, explotabilidad y un fix concreto para cada finding.</p>

          <p>Los dos tipos de engagement rinden mejor cuando matchean el objetivo real del cliente. Un <strong>penetration test</strong> es cobertura profunda y metódica de un scope definido, cada finding accionable entregado con severidad, explotabilidad y un path de fix concreto, útil tanto para los equipos técnicos como para stakeholders de audit y compliance. Un <strong>red team engagement</strong> es adversarial por diseño: chainear findings, mantener OPSEC, y llegar al objetivo declarado del cliente (domain admin, exfil de datos específicos, acceso a un sistema clave) usando los vectores que un atacante real usaría, no los que espera el checklist.</p>

          <h2>Focus</h2>
          <p>Full-scope offensive security. I work on both <em>targeted penetration tests</em> against a defined technical scope and <em>adversarial red team engagements</em> against a business objective. My reports prioritize real, actionable attack paths, with severity, exploitability, and a concrete fix path for every finding.</p>

            <li><strong>Web application and API penetration testing</strong>: business logic, authorization gaps, IDORs, variant hunting on recent patches, REST + GraphQL. This is the core of most engagements.</li>

            <li><strong>Active Directory</strong>: enumeration, privilege escalation, lateral movement, persistence. Applicable in both scoped pentests and full-scope red team engagements.</li>
            <li><strong>Red team operations</strong>: phishing and vishing with custom pretexts, physical covert entry, chained attack paths to a declared objective, OPSEC-conscious throughout.</li>
            <li><strong>Vulnerability research</strong> on OSS, with published CVEs and technical writeups on the <a href="/blog/">blog</a>.</li>
          </ul>

          <h2>How I work</h2>
          <p>Both engagement types deliver best when they match the client's actual goal. A <strong>penetration test</strong> is deep, methodical coverage of a defined scope, every actionable finding returned with severity, exploitability, and a concrete fix path, useful for both technical teams and audit/compliance stakeholders. A <strong>red team engagement</strong> is adversarial by design: chain findings, keep OPSEC, reach the client's stated objective (domain admin, exfiltration of specific data, access to a key system) using the vectors a real attacker would use rather than the ones the checklist expects.</p>
          <p>For vulnerability disclosure on OSS, everything ships with a runnable PoC, code-level analysis, and a concrete fix recommendation. Assigned CVEs are on the <a href="/cves/">cves</a> page.</p>

          <p>I report vulnerabilities under my own name on <a href="https://hackerone.com/bl4cksku111" target="_blank" rel="noopener">HackerOne</a> and <a href="https://bugcrowd.com/h/bl4cksku111" target="_blank" rel="noopener">Bugcrowd</a>. Coordinated programs and VDPs alike.</p>

    let currentLang = (function () { try { return localStorage.getItem('lang') || 'en'; } catch (_) { return 'en'; } })();

    function apply() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('crumb').textContent    = t.crumb;
      document.getElementById('title').textContent    = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('body').innerHTML       = t.body;
    }
    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (_) {}
      apply();
    }
    apply();
    document.getElementById('year').textContent = new Date().getFullYear();
