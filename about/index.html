          <p>Based in Panama. Independent consultant and founder of <a href="https://zerotrustoffsec.com" target="_blank" rel="noopener">ZeroTrust OffSec</a>, an offensive-security boutique focused on red team engagements and research. Organizer of <a href="https://dcgpanama.zerotrustoffsec.com" target="_blank" rel="noopener">DCG Panama</a>, the local DEF CON Groups chapter.</p>
          <p>I report vulnerabilities under my own name on <a href="https://hackerone.com/bl4cksku11" target="_blank" rel="noopener">HackerOne</a> and <a href="https://bugcrowd.com/h/bl4cksku11" target="_blank" rel="noopener">Bugcrowd</a>. Coordinated programs and VDPs alike.</p>

    let currentLang = (function () { try { return localStorage.getItem('lang') || 'en'; } catch (_) { return 'en'; } })();

    function apply() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('crumb').textContent    = t.crumb;
      document.getElementById('title').textContent    = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('body').innerHTML       = t.body;
    }
    function setLang(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (_) {}
      apply();
    }
    apply();
    document.getElementById('year').textContent = new Date().getFullYear();
