  <style>
    /* ── LANDING-SPECIFIC ── */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main.wrap {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
      width: 100%;
    }

    /* Header */
    .header {
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.05s forwards;
    }

    .handle {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--fg-strong);
      cursor: default;
      user-select: none;
    }

    .realname {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 0.7rem;
      font-weight: 400;
    }

    .role-line {
      margin-top: 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--mid);
      text-transform: uppercase;
    }
    .role-line::before {
      content: '› ';
      color: var(--red);
      font-weight: 700;
    }
    .role-affiliation {
      margin-top: 0.35rem;
      padding-left: 1.1rem;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .role-affiliation a {
      color: var(--mid);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .role-affiliation a:hover { color: var(--fg-strong); border-color: var(--red); }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    /* Bio */
    .bio {
      font-size: 0.9rem;
      line-height: 1.9;
      color: var(--fg);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.15s forwards;
    }
    .bio em {
      font-style: normal;
      color: var(--fg-strong);
      font-weight: 700;
    }

    /* Section label */
    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-label::before {
      content: '//';
      color: var(--red);
      font-weight: 700;
    }

    /* Featured card (blog) */
    .featured-card {
      display: block;
      padding: 1.5rem 1.6rem;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--fg-strong);
      background: var(--bg-elevated);
      transition: border-color 0.2s, transform 0.2s;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.25s forwards;
      position: relative;
    }
    .featured-card:hover {
      border-color: var(--red);
      transform: translateY(-1px);
    }

    .featured-tag {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .featured-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.005em;
      margin-bottom: 0.4rem;
      color: var(--fg-strong);
    }
    .featured-desc {
      font-size: 0.82rem;
      color: var(--mid);
      line-height: 1.6;
    }
    .featured-arrow {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      color: var(--red);
      opacity: 0;
      transition: all 0.2s;
      font-size: 1.1rem;
    }
    .featured-card:hover .featured-arrow {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    /* Social links row (LinkedIn, X, GitHub) */
    .social-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.35s forwards;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 0.5rem;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--mid);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .social-link:hover {
      color: var(--fg-strong);
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    /* Ventures (ZeroTrust + DCG) */
    .ventures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.45s forwards;
    }

    .venture {
      padding: 1rem 1.2rem;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--fg-strong);
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .venture:hover {
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    .venture-tag {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.3rem;
    }
    .venture-tag::before {
      content: '//';
      color: var(--red);
      margin-right: 0.3rem;
    }
    .venture-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--fg-strong);
    }

    /* Contact / status */
    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.55s forwards;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .contact-link {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--mid);
      text-decoration: none;
      transition: color 0.15s;
      word-break: break-all;
    }
    .contact-link:hover { color: var(--fg-strong); }

    /* Footer */
    footer.site-footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer.site-footer a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.15s;
    }
    footer.site-footer a:hover { color: var(--fg); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      main.wrap { padding: 2.2rem 1.1rem 3rem; }
      .header { margin-bottom: 2rem; }
      .realname { font-size: 0.78rem; }
      .role-line { font-size: 0.78rem; }
      .bio { font-size: 0.85rem; line-height: 1.85; }
      .featured-card { padding: 1.2rem 1.3rem; }
      .featured-arrow { display: none; }
      .social-row { grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
      .social-link { font-size: 0.68rem; padding: 0.75rem 0.4rem; }
      .ventures { grid-template-columns: 1fr; }
      .status { margin-top: 2rem; }
      footer.site-footer { flex-direction: column; gap: 0.6rem; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Site nav -->
  <header class="site-nav">

    <!-- Header -->

  <script>
    /* ── Translations ── */
    const T = {
      es: {
        role:      'Red Team Operator · Penetration Tester',
        affil:     'currently @ <a href="https://a-lign.com" target="_blank" rel="noopener">A-LIGN</a>',
        bio:       '<em>Seguridad ofensiva</em> full-scope. <em>Penetration testing</em> sobre aplicaciones web, APIs, cloud y redes internas, y <em>operaciones de red team</em> adversariales (phishing/vishing, Active Directory, entrada física encubierta, cadenas de ataque hacia un objetivo definido). Rutas de ataque reales, no listas de compliance.',
        writing:   'writing',
        featTag:   'último post',
        featDesc:  'Notas técnicas de vulnerability research, con PoC completo y análisis del código vulnerable. Publico bajo mi propio nombre; los CVEs asignados están en la sección /cves.',
        find:      'find me',
        tagZT:     'security',
        tagDCG:    'community',
        ventures:  'ventures',
        status:    'jrivas@zerotrustoffsec.com',
        menuActive: 'home',
      },
      en: {
        role:      'Red Team Operator · Penetration Tester',
        affil:     'currently @ <a href="https://a-lign.com" target="_blank" rel="noopener">A-LIGN</a>',
        bio:       '<em>Full-scope offensive security</em>. <em>Penetration testing</em> across web apps, APIs, cloud, and internal networks, and <em>red team operations</em> with adversarial intent (phishing/vishing, Active Directory, physical covert entry, chained attack paths to a defined objective). Real attack paths, not compliance checklists.',
        writing:   'writing',
        featTag:   'latest post',
        featDesc:  'Technical vulnerability research writeups, full PoCs, and vulnerable-code analysis. Everything published under my own name; assigned CVEs live under /cves.',
        find:      'find me',
        tagZT:     'security',
        tagDCG:    'community',
        ventures:  'ventures',
        status:    'jrivas@zerotrustoffsec.com',
        menuActive: 'home',
      }
    };

    let currentLang = (function () {
      try { return localStorage.getItem('lang') || 'en'; } catch (_) { return 'en'; }
    })();

    function applyLang(lang) {
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (_) {}
      document.documentElement.lang = lang;
      document.getElementById('btn-es').classList.toggle('active', lang === 'es');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      const t = T[lang];
      document.getElementById('role').textContent           = t.role;
      document.getElementById('affil').innerHTML            = t.affil;
      document.getElementById('bio').innerHTML              = t.bio;
      document.getElementById('lbl-writing').textContent    = t.writing;
      document.getElementById('feat-tag').textContent       = t.featTag;
      document.getElementById('feat-desc').textContent      = t.featDesc;
      document.getElementById('lbl-find').textContent       = t.find;
      document.getElementById('lbl-ventures').textContent   = t.ventures;
      document.getElementById('tag-zt').textContent         = t.tagZT;
      document.getElementById('tag-dcg').textContent        = t.tagDCG;
      document.getElementById('status-txt').textContent     = t.status;
    }

    function setLang(lang) {
      if (lang !== currentLang) applyLang(lang);
    }

    /* Featured post: fetch from blog/posts.json (first entry = latest) */
    async function loadFeatured() {
      try {
        const res = await fetch('/blog/posts.json', { cache: 'no-cache' });
        if (!res.ok) return;
        const data = await res.json();
        const posts = (data.posts || [])
          .filter(p => p.slug && p.date)
          .sort((a, b) => (a.date < b.date ? 1 : -1));
        if (!posts.length) return;
        const latest = posts[0];
        const title = typeof latest.title === 'string' ? latest.title : (latest.title[currentLang] || latest.title.en || latest.title.es);
        document.getElementById('feat-name').textContent = title;
        document.querySelector('.featured-card').href = `/blog/p/${latest.slug}/`;
      } catch (_) {
        // Silent fail; fall back to the generic description
      }
    }

    /* Init */
    applyLang(currentLang);
    loadFeatured();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
